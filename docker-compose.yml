services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "7860:7860"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://host.docker.internal:8080/v1}
      LLAMA_CPP_API_KEY: ${LLAMA_CPP_API_KEY:-no-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

  test:
    build:
      context: .
      target: test
    command: pytest --cov --cov-report=term-missing

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080"]
